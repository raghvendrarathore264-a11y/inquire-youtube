<body>

<div class="box">

    <h1>Inquire_148</h1>

    <p>
        ⚡ Electronics • Technology • DIY Projects
        <br>
        🔧 Building • Experimenting • Learning
    </p>

    <a class="button" id="youtubeButton"
       href="https://www.youtube.com/@inquire_148">

        ▶ Open YouTube

    </a>

    <div class="small">
        Opening YouTube...
    </div>

</div>


<script>

    const webURL =
        "https://www.youtube.com/@inquire_148";


    /*
     * Android Intent URL
     *
     * This asks Android to open the YouTube
     * application if it is installed.
     */

    const intentURL =
        "intent://www.youtube.com/@inquire_148" +
        "#Intent;" +
        "scheme=https;" +
        "package=com.google.android.youtube;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(webURL) +
        ";" +
        "end";


    function openYouTube() {

        /*
         * Only attempt the Android Intent on Android.
         */

        const isAndroid =
            /Android/i.test(navigator.userAgent);


        if (isAndroid) {

            window.location.href = intentURL;

        } else {

            /*
             * iPhone / computer:
             * use normal YouTube link.
             */

            window.location.href = webURL;

        }

    }


    /*
     * Try automatically after the page loads.
     */

    setTimeout(function() {

        openYouTube();

    }, 500);


    /*
     * Also try when the user presses
     * the Open YouTube button.
     */

    document
        .getElementById("youtubeButton")
        .addEventListener("click", function(event) {

            event.preventDefault();

            openYouTube();

        });

</script>

</body>

</html>
