    <div class="container">

        <p>Opening YouTube...</p>

        <a class="button"
           href="https://www.youtube.com/@inquire_148">

    <script>

        // Your YouTube channel
        const youtubeWeb =
            "https://www.youtube.com/@inquire_148";


        // Try to open the YouTube app
        const youtubeApp =
            "youtube://www.youtube.com/@inquire_148";


        // Remember the current time
        const startTime = Date.now();


        // Try opening YouTube app
        window.location.href = youtubeApp;


        // After 1.5 seconds, check whether
        // the browser is still active.

        setTimeout(function () {

            const elapsed =
                Date.now() - startTime;


            // If the browser is still active,
            // open the normal YouTube website.

            if (elapsed < 2500) {

                window.location.href =
                    youtubeWeb;

            }

        }, 1500);

    </script>
